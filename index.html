<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Maps - Psychedelic Travel</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        /* --- VARIÁVEIS E TEMA --- */
        :root {
            --primary: #8a2be2;   /* Roxo */
            --secondary: #00ffff; /* Ciano/Neon */
            --accent: #ff00ff;    /* Magenta */
            --dark: #0a0a1a;      /* Fundo Dark */
            --light: #f0f8ff;
            --neon-glow: 0 0 10px var(--secondary), 0 0 20px var(--primary);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
        }

        /* --- BACKGROUND PSICODÉLICO --- */
        #psychedelic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.2;
        }

        /* --- HEADER & BANNER --- */
        header {
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--primary);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        .banner-container {
            width: 100%;
            max-height: 350px;
            overflow: hidden;
            border-bottom: 2px solid var(--secondary);
        }

        .main-banner {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: brightness(0.9);
            transition: 0.5s;
        }

        .main-banner:hover {
            filter: brightness(1.1);
        }

        .container { width: 90%; max-width: 1200px; margin: 0 auto; }

        nav { padding: 15px 0; }
        nav ul {
            display: flex;
            list-style: none;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav ul li a {
            color: var(--light);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: var(--secondary);
            text-shadow: 0 0 8px var(--secondary);
        }

        /* --- SEÇÕES --- */
        section { padding: 60px 0; }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- MAPA E FILTROS --- */
        .map-section {
            background: rgba(20, 20, 40, 0.6);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--primary);
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
        }

        .filters {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #interactive-map {
            height: 550px;
            border-radius: 15px;
            border: 2px solid var(--secondary);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
        }

        .search-box {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--primary);
            border-radius: 10px;
            color: white;
            margin-bottom: 20px;
        }

        /* --- CARDS --- */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .package-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--primary);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transition: 0.4s;
        }

        .package-card:hover {
            transform: translateY(-10px);
            border-color: var(--secondary);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
        }

        /* --- MARCADEURES MAPA --- */
        .fullon-marker { background-color: #FF6B6B; border-radius: 50%; border: 2px solid #fff; }
        .prog-marker { background-color: #4ECDC4; border-radius: 50%; border: 2px solid #fff; }
        .forest-marker { background-color: #96CEB4; border-radius: 50%; border: 2px solid #fff; }
        .darkpsy-marker { background-color: #6A0DAD; border-radius: 50%; border: 2px solid #fff; }

        @media (max-width: 768px) {
            .map-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <canvas id="psychedelic-bg"></canvas>

    <header>
        <div class="banner-container">
            <img src="https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/img/visual-identity/banner-nomad-maps.jpg" alt="Nomad Maps" class="main-banner">
        </div>
        
        <div class="container">
            <nav>
                <ul>
                    <li><a href="#mapa">Mapa Interativo</a></li>
                    <li><a href="#produtos">Pacotes</a></li>
                    <li><a href="#galeria">Galeria</a></li>
                    <li><a href="#data-trance">Data-Trance</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="mapa">
            <div class="section-title">
                <h2>Exploração Psicodélica</h2>
                <p>Mapeamento global de festivais e cultura trance</p>
            </div>

            <div class="map-section">
                <aside class="filters">
                    <input type="text" class="search-box" placeholder="🔍 Buscar festival ou país...">
                    <div style="margin-top: 20px;">
                        <h4 style="color: var(--secondary); margin-bottom: 10px;">Status</h4>
                        <div id="status-filters">
                            </div>
                    </div>
                </aside>
                <div id="interactive-map"></div>
            </div>
        </section>

        <section id="produtos">
            <div class="section-title">
                <h2>Experiências Nomad</h2>
            </div>
            <div class="packages-grid">
                <div class="package-card">
                    <div style="font-size: 3rem; margin-bottom: 15px;">🌌</div>
                    <h3>Full Experience</h3>
                    <p>Ingresso + Transporte + Camping VIP</p>
                    <button style="margin-top: 20px; padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 20px; cursor: pointer;">Saber Mais</button>
                </div>
                <div class="package-card">
                    <div style="font-size: 3rem; margin-bottom: 15px;">🛸</div>
                    <h3>Teleport Pack</h3>
                    <p>Apenas transporte saindo das principais capitais</p>
                    <button style="margin-top: 20px; padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 20px; cursor: pointer;">Saber Mais</button>
                </div>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Configuração do Mapa
        const map = L.map('interactive-map').setView([-15, -50], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; Nomad Maps'
        }).addTo(map);

        // Background Animation (Simple canvas effect)
        const canvas = document.getElementById('psychedelic-bg');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 26, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Simulação de pulso
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
