<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        /* Variáveis de Cores */
        :root {
            --primary: #8a2be2;
            --secondary: #00ffff;
            --accent: #ff00ff;
            --dark: #050510; /* Fundo mais escuro como solicitado */
            --light: #ffffff; /* Letras totalmente brancas */
            --neon-glow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor;
        }

        /* Marcadores do Mapa */
        .fullon-marker { background-color: #FF6B6B; }
        .prog-marker { background-color: #4ECDC4; }
        .forest-marker { background-color: #96CEB4; }
        .darkpsy-marker { background-color: #6A0DAD; }
        .core-marker { background-color: #FFEAA7; }
        .hitech-marker { background-color: #FFA500; }
        .night-marker { background-color: #2C3E50; }
        .goa-marker { background-color: #E74C3C; }
        .default-marker { background-color: #95A5A6; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 255, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 30%);
        }

        /* Estilo do Banner */
        .banner-container {
            width: 100%;
            max-height: 350px;
            overflow: hidden;
            border-bottom: 2px solid var(--secondary);
        }
        .main-banner {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: brightness(0.9);
        }

        header {
            background: linear-gradient(135deg, rgba(5, 5, 16, 0.9) 0%, rgba(138, 43, 226, 0.7) 100%);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--secondary);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }

        .logo {
            max-width: 300px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(138, 43, 226, 0.7));
        }

        nav ul {
            display: flex;
            list-style: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        nav ul li a {
            color: var(--light);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        nav ul li a:hover { color: var(--secondary); }

        /* Hero Section Original */
        .hero {
            height: 30vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .cta-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 5px;
        }

        /* Map Controls Original */
        .map-section {
            background: rgba(10, 10, 30, 0.8);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .map-controls {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
            margin-top: 25px;
        }

        #interactive-map {
            height: 500px;
            border-radius: 15px;
            border: 2px solid var(--secondary);
        }

        /* Outros estilos originais mantidos */
        .geo-analysis {
            background: rgba(10, 10, 30, 0.7);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .thematic-map-large img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid var(--secondary);
        }

        @media (max-width: 768px) {
            .map-controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <img src="https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/img/visual-identity/banner-nomad-maps.jpg" alt="Nomad Maps" class="main-banner">
    </div>

    <header>
        <div class="container">
            <div class="header-content">
                <img src="https://github.com/ramadageografia/nomad_maps/blob/main/assets/Imagens/visual%20identity/Nomad_Logo.png?raw=true" alt="Nomad Maps Logo" class="logo">
                <nav>
                    <ul>
                        <li><a href="#home">Início</a></li>
                        <li><a href="#produtos">Produtos</a></li>
                        <li><a href="#mapa">Mapa Interativo</a></li>
                        <li><a href="#galeria">Galeria</a></li>
                        <li><a href="#data-trance">Data-Trance</a></li>
                        <li><a href="#contact">Contato</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero" id="home">
        <div class="hero-content">
            <div class="hero-buttons">
                <a href="#mapa" class="cta-button">Explorar Mapa</a>
                <a href="#produtos" class="cta-button">Ver Produtos</a>
            </div>
            <p>Descubra os melhores festivais de psytrance ao redor do mundo</p>
        </div>
    </section>

    <section id="mapa" class="container">
        <div class="geo-analysis">
            <p>Mapa-mundi dinâmico com geolocalização de festivais, filtros por nome, país, continente e subvertentes.</p>
        </div>

        <div class="map-section">
            <div class="map-controls">
                <aside class="filters">
                    <input type="text" class="search-box" style="width:100%; padding:10px; border-radius:20px; background:rgba(255,255,255,0.1); color:white; border:1px solid var(--primary);" placeholder="🔍 Buscar festival...">
                    <div style="margin-top:20px;">
                        <h3 style="color:var(--secondary)">Filtros</h3>
                        </div>
                </aside>
                <div id="interactive-map"></div>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Inicialização do Mapa
        const map = L.map('interactive-map').setView([-15, -50], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; Nomad Maps'
        }).addTo(map);
    </script>
</body>
</html>
