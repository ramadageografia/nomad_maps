<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        /* Variáveis de Cores */
        :root {
            --primary: #8a2be2;
            --secondary: #00ffff;
            --accent: #ff00ff;
            --dark: #050510; /* Fundo bem escuro */
            --light: #ffffff; /* Letras Brancas */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--dark);
            color: var(--light);
            overflow-y: auto; /* Garante a rolagem */
            line-height: 1.6;
        }

        header {
            background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--primary);
            padding: 10px 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Ajuste da Logo */
        .logo {
            max-width: 220px; /* Tamanho controlado para não quebrar a página */
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 5px var(--primary));
        }

        nav ul {
            display: flex;
            list-style: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        nav ul li a {
            color: var(--light);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: var(--secondary);
            text-shadow: 0 0 8px var(--secondary);
        }

        /* Hero / Intro */
        .hero {
            padding: 60px 0;
            text-align: center;
        }

        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero p { color: var(--secondary); font-size: 1.1rem; }

        /* Mapa Section */
        .map-section {
            background: rgba(20, 20, 40, 0.5);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            margin-top: 20px;
        }

        #interactive-map {
            height: 500px;
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--secondary);
        }

        .map-controls {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .filters {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
        }

        /* Marcadores */
        .fullon-marker { background-color: #FF6B6B; border-radius: 50%; }
        .prog-marker { background-color: #4ECDC4; border-radius: 50%; }

        @media (max-width: 768px) {
            .map-controls { grid-template-columns: 1fr; }
            .logo { max-width: 150px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="header-content">
                <a href="#home">
                    <img src="https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/img/visual-identity/Nomad_Logo.png" alt="Nomad Maps Logo" class="logo">
                </a>
                <nav>
                    <ul>
                        <li><a href="#home">Início</a></li>
                        <li><a href="#mapa">Mapa</a></li>
                        <li><a href="#produtos">Produtos</a></li>
                        <li><a href="#galeria">Galeria</a></li>
                        <li><a href="#data-trance">Data-Trance</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero" id="home">
            <h1>Exploração Psicodélica</h1>
            <p>Geolocalização da cultura trance ao redor do globo.</p>
        </section>

        <section id="mapa">
            <div class="map-section">
                <div class="map-controls">
                    <aside class="filters">
                        <h3 style="margin-bottom: 10px; font-size: 0.9rem;">FILTRAR BUSCA</h3>
                        <input type="text" placeholder="Buscar festival..." style="width:100%; padding:8px; background:#1a1a2e; color:white; border:1px solid var(--primary); border-radius:5px;">
                    </aside>
                    <div id="interactive-map"></div>
                </div>
            </div>
        </section>

        <section style="height: 500px;"></section> 
    </main>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Inicialização do Mapa
        const map = L.map('interactive-map').setView([-15, -50], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    </script>
</body>
</html>
