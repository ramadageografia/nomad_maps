<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Nomad Maps — Psytrance & Visionary Culture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<!-- HEADER -->
<header class="header">
  <img src="assets/banner-nomad-maps.jpg" alt="Nomad Maps" class="logo-banner">
  <p class="tagline">
    Sua agência de viagens especializada em festivais de arte e cultura visionária e psytrance pelo mundo!
  </p>
</header>

<!-- MAIN -->
<main class="map-layout">

  <!-- LISTA (ESQUERDA) -->
  <section class="festival-list">
    <h2>Festivais pelo Mundo</h2>
    <p>Clique no mapa para detalhes e consultoria de viagem.</p>
  </section>

  <!-- MAPA (DIREITA) -->
  <section class="map-container">
    <div id="festivalMap"></div>
  </section>

</main>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2024 Nomad Maps — Web GIS Turístico Psytrance</p>
</footer>

<!-- Leaflet JS -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- JS -->
<script src="js/main.js"></script>

</body>
</html>
