<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Maps - Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* GARANTINDO O FUNDO ESCURO QUE VOCÊ QUER */
        :root {
            --dark-bg: #0f172a;
            --sidebar-bg: #1e293b;
            --accent: #10b981;
            --text: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--dark-bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* HEADER COM A LOGO CENTRALIZADA */
        .nomad-header {
            height: 180px;
            background: var(--dark-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid var(--accent);
        }

        .nomad-header img {
            height: 140px;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4));
        }

        /* ESTRUTURA DASHBOARD */
        .dashboard-container {
            display: flex;
            height: calc(100vh - 180px);
        }

        #map {
            flex: 3;
            height: 100%;
            z-index: 1;
        }

        .sidebar {
            flex: 1;
            background: var(--sidebar-bg);
            border-left: 1px solid #334155;
            padding: 20px;
            overflow-y: auto;
        }

        /* ESTILO DOS FLYERS NO HOVER (O QUE VOCÊ QUERIA) */
        .flyer-tooltip {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        .flyer-card {
            background: rgba(15, 23, 42, 0.95);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            text-align: center;
            color: white;
        }
        .flyer-card img {
            width: 200px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <header class="nomad-header">
        <img src="https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/visual%20identity/Nomad_Logo.png" alt="Nomad Maps">
    </header>

    <div class="dashboard-container">
        <div id="map"></div>
        <aside class="sidebar">
            <h2 style="color: var(--accent);">Explorar Festivais</h2>
            <p>Passe o mouse nos ícones para ver os detalhes e flyers.</p>
            <hr style="border: 0.5px solid #334155; margin: 20px 0;">
            <div id="stats">
                <p><strong>Status:</strong> Mapa Online</p>
            </div>
        </aside>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializa o mapa com tema escuro
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // Ícone customizado
        const nomadIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/icones/marker_nomad.png',
            iconSize: [30, 30],
            iconAnchor: [15, 30]
        });

        // Lista de Festivais (Links Raw corrigidos)
        const festivais = [
            { nome: "Aluna Ritual", lat: -23.55, lng: -46.63, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Aluna%20Ritual/flyer_aluna.jpg" },
            { nome: "Universo Paralello", lat: -13.90, lng: -38.93, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Universo%20Paralello/flyer_up.jpg" },
            { nome: "Boom Festival", lat: 39.92, lng: -7.49, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Boom/boomimh.png" },
            { nome: "Ozora Festival", lat: 46.75, lng: 18.44, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Ozora/banner_ozora26.jpg" },
            { nome: "ZNA Gathering", lat: 38.64, lng: -8.19, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/ZNA/flter_zna.jpg" }
        ];

        // Adiciona marcadores com hover
        festivais.forEach(f => {
            const marker = L.marker([f.lat, f.lng], { icon: nomadIcon }).addTo(map);
            
            marker.bindTooltip(`
                <div class="flyer-card">
                    <img src="${f.flyer}" onerror="this.src='https://via.placeholder.com/200x250?text=Flyer+em+Breve'">
                    <br><strong>${f.nome}</strong>
                </div>
            `, {
                direction: 'top',
                className: 'flyer-tooltip',
                opacity: 1
            });
        });
    </script>
</body>
</html>
