<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        /* ================== ESTILOS GERAIS E CORES =================*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #8a2be2;
            --secondary: #00ffff;
            --accent: #ff00ff;
            --dark: #0a0a1a;
            --light: #ffffff; /* Texto agora é puramente branco */
        }
        
        body {
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
        }

        /* Força todos os textos principais para branco */
        h1, h2, h3, h4, p, span, li, a {
            color: #ffffff !important;
        }

        header {
            background: linear-gradient(135deg, rgba(10, 10, 26, 0.9) 0%, rgba(138, 43, 226, 0.7) 100%);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--secondary);
        }

        .container { width: 90%; max-width: 1200px; margin: 0 auto; }
        .header-content { display: flex; flex-direction: column; align-items: center; }
        .logo { max-width: 400px; margin-bottom: 10px; }

        nav ul { display: flex; list-style: none; justify-content: center; }
        nav ul li { margin: 0 10px; }
        nav ul li a { text-decoration: none; font-weight: 600; font-size: 0.9rem; }

        /* ================== ESTILO DO MAPA E TOOLTIPS (FLYERS) =================*/
        #interactive-map {
            height: 600px;
            width: 100%;
            border-radius: 15px;
            border: 2px solid var(--secondary);
            background: #1a1a2e;
        }

        /* Estilo do Flyer que aparece no Hover */
        .flyer-tooltip {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .flyer-container {
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--secondary);
        }

        .flyer-img {
            width: 200px; /* Tamanho do flyer no mapa */
            border-radius: 5px;
            display: block;
        }

        .cta-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white !important;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 5px;
        }

        section { padding: 40px 0; }
        .section-title { text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="header-content">
                <img src="https://github.com/ramadageografia/nomad_maps/blob/main/assets/Imagens/visual%20identity/Nomad_Logo.png?raw=true" alt="Nomad Maps Logo" class="logo">
                <nav>
                    <ul>
                        <li><a href="#">Início</a></li>
                        <li><a href="#mapa">Mapa</a></li>
                        <li><a href="#">Produtos</a></li>
                        <li><a href="#">Contato</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section id="mapa">
        <div class="container">
            <div class="section-title">
                <h2>Explore os Festivais</h2>
                <p>Passe o mouse nos ícones para ver o flyer</p>
            </div>
            
            <div id="interactive-map"></div>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    
    <script>
        // 1. Inicializar o Mapa
        const map = L.map('interactive-map').setView([0, 0], 2);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // 2. Função para criar ícone personalizado
        // Nota: Substitua 'marcador_psicodelico.png' pelo nome real do ícone na sua pasta
        const nomadIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/icones/marker_nomad.png', 
            iconSize: [35, 35],
            iconAnchor: [17, 35],
            popupAnchor: [0, -35]
        });

        // 3. Base de Dados dos Festivais com os seus links do GitHub
        const festivais = [
            { nome: "Aluna Ritual", lat: -23.55, lng: -46.63, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Aluna%20Ritual/flyer_aluna.jpg" },
            { nome: "Boom Festival", lat: 39.92, lng: -7.49, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Boom/boomimh.png" },
            { nome: "Burning Mountain", lat: 46.77, lng: 10.15, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Burning%20Mountain/flyer_burnimontain.png" },
            { nome: "Envision Festival", lat: 9.15, lng: -83.73, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Envision/banner_enviision.jpg" },
            { nome: "Hadra Trance", lat: 45.24, lng: 5.30, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Hadra%20Trance/flyer-hadra.jpg" },
            { nome: "Ozora Festival", lat: 46.75, lng: 18.44, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Ozora/banner_ozora26.jpg" },
            { nome: "Universo Paralello", lat: -13.90, lng: -38.93, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Universo%20Paralello/flyer_up.jpg" },
            { nome: "ZNA Gathering", lat: 38.64, lng: -8.19, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/ZNA/flter_zna.jpg" }
            // ... adicione os outros seguindo este padrão
        ];

        // 4. Adicionar Marcadores ao Mapa
        festivais.forEach(festa => {
            const marker = L.marker([festa.lat, festa.lng], { icon: nomadIcon }).addTo(map);

            // Conteúdo do Tooltip (Flyer no Hover)
            const tooltipContent = `
                <div class="flyer-container">
                    <img src="${festa.flyer}" class="flyer-img">
                    <p style="margin-top:8px; font-weight:bold;">${festa.nome}</p>
                </div>
            `;

            marker.bindTooltip(tooltipContent, {
                direction: 'top',
                className: 'flyer-tooltip',
                opacity: 1,
                offset: [0, -10]
            });

            // Popup ao clicar
            marker.bindPopup(`<b>${festa.nome}</b><br>Explore a geolocalização completa.`);
        });
    </script>
</body>
</html>
