<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nomad Maps</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>

    <header class="nomad-header">
        <img src="https://github.com/ramadageografia/nomad_maps/blob/main/assets/Imagens/visual%20identity/Nomad_Logo.png?raw=true" class="logo-image-large">
    </header>

    <main class="main-content">
        <div class="map-container">
            <div id="map"></div>
        </div>

        <aside class="sidebar">
            <h3 style="color: #10b981; margin-bottom: 15px;">Festivais</h3>
            <div id="festivals-list">
                <p>Passe o mouse nos marcadores para ver os flyers.</p>
            </div>
        </aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-15, -50], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        const nomadIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/icones/marker_nomad.png',
            iconSize: [30, 30],
            iconAnchor: [15, 30]
        });

        const festivais = [
            { nome: "Aluna Ritual", lat: -23.55, lng: -46.63, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Aluna%20Ritual/flyer_aluna.jpg" },
            { nome: "Universo Paralello", lat: -13.90, lng: -38.93, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Universo%20Paralello/flyer_up.jpg" },
            { nome: "Boom Festival", lat: 39.92, lng: -7.49, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Boom/boomimh.png" },
            { nome: "Ozora Festival", lat: 46.75, lng: 18.44, flyer: "https://raw.githubusercontent.com/ramadageografia/nomad_maps/main/assets/Imagens/flyers/Ozora/banner_ozora26.jpg" }
        ];

        festivais.forEach(f => {
            const m = L.marker([f.lat, f.lng], { icon: nomadIcon }).addTo(map);
            m.bindTooltip(`
                <div class="flyer-card">
                    <img src="${f.flyer}">
                    <br><strong style="color:white">${f.nome}</strong>
                </div>
            `, { direction: 'top', className: 'flyer-tooltip' });
        });
    </script>
</body>
</html>
