<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Nomad Maps — Psytrance & Visionary Culture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<header class="header">
  <img src="assets/banner-nomad-maps.jpg" class="logo-banner" alt="Nomad Maps">
  <p class="tagline">
    Sua agência de viagens especializada em festivais de arte e cultura visionária e psytrance pelo mundo!
  </p>
</header>

<main class="map-layout">

  <!-- PAINEL ESQUERDO -->
  <aside class="festival-list">

    <h2>Filtros</h2>

    <select id="filterCountry">
      <option value="">🌍 Todos os países</option>
    </select>

    <select id="filterGenre">
      <option value="">🎶 Todas as vertentes</option>
    </select>

    <h2>Festivais</h2>
    <div id="festivalItems"></div>

  </aside>

  <!-- MAPA -->
  <section class="map-container">
    <div id="festivalMap"></div>
  </section>

</main>

<footer class="footer">
  © 2024 Nomad Maps — Web GIS Turístico Psytrance
</footer>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/main.js"></script>

</body>
</html>
