<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nomad Maps</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>

    <header class="nomad-header">
        <img src="https://github.com/ramadageografia/nomad_maps/blob/main/assets/Imagens/visual%20identity/Nomad_Logo.png?raw=true" class="logo-image-large">
    </header>

    <main class="main-content">
        <div class="map-container">
            <div id="map"></div>
        </div>

        <aside class="sidebar">
            <div class="filter-section-sidebar">
                <h5 style="color: #10b981;">Filtros</h5>
                <select id="continent-filter" class="form-select">
                    <option value="all">Todos os Continentes</option>
                </select>
            </div>
            <div id="festivals-list">
                </div>
        </aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Inicialização do mapa
        const map = L.map('map').setView([-15, -50], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // Se você tiver o arquivo festivals.js, ele deve ser carregado aqui
    </script>
</body>
</html>
